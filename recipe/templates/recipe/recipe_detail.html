<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ recipe.title }}</title>
</head>
<body>
    <p><a href="/">← На главную</a></p>
    <h1>{{ recipe.title }}</h1>
    <p><strong>Категория:</strong> {{ recipe.category }}</p>
    <p><strong>Автор:</strong> {{ recipe.author.username }}</p>

    <h3>Ингредиенты</h3>
    <p>{{ recipe.ingredients|linebreaks }}</p>

    <h3>Шаги приготовления</h3>
    <p>{{ recipe.steps|linebreaks }}</p>

    <p>
        <a href="/recipe/{{ recipe.id }}/edit/">Редактировать</a>
        <a href="/recipe/{{ recipe.id }}/delete/">Удалить</a>
    </p>
</body>
</html>
