<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Удаление рецепта</title>
</head>
<body>

    <h1>Вы действительно хотите удалить рецепт «{{ recipe.title }}»?</h1>

    </form>
</body>
</html>
