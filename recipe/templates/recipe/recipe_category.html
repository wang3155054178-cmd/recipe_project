<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Рецепты по категории</title>
</head>
<body>
    <p><a href="/">← На главную</a></p>
    <h1>Рецепты выбранной категории</h1>
    {% for r in recipes %}
    <div>
        <h3>{{ r.title }}</h3>
        <p>Категория: {{ r.category }}</p>
        <a href="/recipe/{{ r.id }}/">Подробнее</a>
    </div>
    {% empty %}
    <p>В этой категории нет рецептов.</p>
    {% endfor %}
</body>
</html>
