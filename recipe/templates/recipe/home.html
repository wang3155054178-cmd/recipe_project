{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Главная страница</title>
</head>
<body>
    <h1>Список рецептов</h1>
    <p>
        <a href="/accounts/register/">Регистрация</a>
        <a href="/accounts/login/">Войти</a>
        <a href="/recipe/add/">Добавить рецепт</a>
        <a href="/accounts/profile/">Личный кабинет</a>
    </p>

    {% for r in recipes %}
    <div>
        <h3>{{ r.title }}</h3>
        <p>Категория: {{ r.category }}</p>
        <a href="/recipe/{{ r.id }}/">Посмотреть детали</a>
    </div>
    {% empty %}
    <p>Рецептов в базе нет.</p>
    {% endfor %}
</body>
</html>
