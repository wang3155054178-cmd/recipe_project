
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans‑serif;
            max‑width: 960px;
            margin: 30px auto;
            padding: 0 20px;
            background‑color: #f5f7fa;
        }
        h1,h3 {
            color:#2c3e50;
            margin‑bottom:18px;
            margin‑top:24px;
        }
        .back‑link a {
            color:#3498db;
            text‑decoration:none;
            margin‑bottom:20px;
            display:inline‑block;
        }
        .recipe‑item {
            background‑color:#fff;
            border:1px solid #dde2e8;
            padding:14px;
            margin‑bottom:10px;
            border‑radius:6px;
        }
        .recipe‑item a {
            color:#3498db;
            text‑decoration:none;
        }
        .recipe‑item a:hover {
            text‑decoration:underline;
        }
        .add‑btn a {
            display:inline‑block;
            background‑color:#27ae60;
            color:white;
            text‑decoration:none;
            padding:9px 16px;
            border‑radius:4px;
            margin‑top:12px;
        }
        .add‑btn a:hover {
            background‑color:#219653;
        }
    </style>
</head>
<body>
    <p class="back‑link"><a href="/">← На главную</a></p>
    <h1>Личный кабинет: {{ user.username }}</h1>
    <h3>Мои рецепты</h3>
    {% for r in my_recipes %}
    <div class="recipe‑item">
        <h4>{{ r.title }}</h4>
        <a href="/recipe/{{r.id}}/">Открыть</a>
    </div>
    {% empty %}
    <p>Вы ещё не добавляли рецепты.</p>
    {% endfor %}
    <p class="add‑btn"><a href="/recipe/add/">Добавить новый рецепт</a></p>
</body>
</html>
